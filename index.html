<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore your place from the Milky Way to satellite imagery above your location."><title>Location Visualizer</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css"><link rel="stylesheet" href="/src/style.css"></head>
<body><div id="earth" aria-label="Interactive satellite globe"></div><canvas id="space" aria-label="Illustrative astronomical context"></canvas>
<header><form id="coordinate-form"><label class="sr-only" for="location-input">Latitude, longitude</label><input id="location-input" type="text" value="37.4083, -122.1790" placeholder="37.4083, -122.1790" aria-describedby="status" aria-label="Latitude, longitude" enterkeyhint="go" autocomplete="off" spellcheck="false" disabled></form><p id="status" class="sr-only" role="status" aria-live="polite">Loading satellite globe…</p></header>
<main><section class="scale-panel" aria-label="Zoom control"><label class="sr-only" for="scale">Zoom from Milky Way to your location</label><input id="scale" type="range" min="0" max="3" step="0.001" value="2.26" aria-describedby="distance context"><span id="distance" class="sr-only">Camera altitude</span><p id="context" class="sr-only">Drag to rotate · Scroll to zoom · Right-drag to tilt</p></section></main>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script><script type="module" src="/src/main.js"></script></body></html>
